name: PR Title

# Validate that the pull-request title follows Conventional Commits. The repo
# squash-merges and the PR title becomes the squash commit subject, so a
# conventional title keeps `main`'s history parseable. Titles are hygiene only —
# releases are changesets-only (knope), not title-driven.

on:
  pull_request:
    # This required check runs on a draft too, because it is cheap.
    # `ready_for_review` runs it again on the flip to ready.
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            ci
            build
            test
            refactor
            style
