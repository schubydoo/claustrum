# Keep open PRs current with main so the strict-up-to-date ruleset never
# forces a manual "Update branch" click. When main moves, merge it into every
# open PR's branch (the same effect as the "Update branch" button).
# Squash-merge collapses those merge commits, so main's history stays linear.
#
# Rolled in-repo (first-party, SHA-pinned actions/github-script) rather than a
# third-party auto-update action — zero supply-chain surface to re-audit.
#
# Auth + API: the pulls.updateBranch REST endpoint is NOT available to GitHub
# Apps (its OpenAPI enabledForGitHubApps is false), and the default GITHUB_TOKEN
# is App-backed — so it can never call it (403). We instead use the repos.merge
# endpoint (enabledForGitHubApps: true), authorized by a short-lived App token
# (reuses the claustrum-ci App secrets — no new credential). An App token also
# re-triggers the updated PR's CI.
#
# Bot-authored PRs (knope's release PR, Renovate) are skipped via the
# `user.type === "Bot"` check; fork PRs and the excluded labels are skipped too.
#
# Two operational levers (ported from clauster):
#   - Per-PR hold: label a PR `no-autoupdate` to leave it BEHIND main (it stays
#     out of the sweep until the maintainer updates it by hand).
#   - Global kill-switch: `gh variable set AUTO_UPDATE --body off` pauses the
#     whole sweep repo-wide (every open PR is left behind); `gh variable set
#     AUTO_UPDATE --body on` (or `gh variable delete AUTO_UPDATE`) resumes it.
# Either way, a held/paused PR sits BEHIND main and can't merge under the
# strict-up-to-date ruleset until it's updated by hand — that's the intent.
name: Auto-update PRs

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoupdate:
    name: update open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # job token only reads; the App token (below) does writes
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Exactly what the merges API needs.
          permission-contents: write
          permission-pull-requests: read

      # Fail loud if the mint produced an empty token. Without this guard,
      # github-script below would fall back to the job's GITHUB_TOKEN, and merge
      # commits pushed with GITHUB_TOKEN do not re-trigger the updated PR's CI.
      - name: Verify App token was minted
        if: ${{ steps.app-token.outputs.token == '' }}
        run: |
          echo "::error::App token mint produced an empty token; refusing to proceed (a merge commit pushed with GITHUB_TOKEN would not re-trigger PR CI)."
          exit 1

      - name: Update open PRs targeting the default branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTO_UPDATE: ${{ vars.AUTO_UPDATE }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const mode = (process.env.AUTO_UPDATE || 'on').trim().toLowerCase();
            if (mode === 'off') { core.info('auto-update disabled via the AUTO_UPDATE repo variable'); return; }
            const EXCLUDE = new Set([
              "dependencies",
              "no-autoupdate", // per-PR opt-out: the maintainer updates this one by hand
              "autorelease: pending",
              "autorelease: tagged",
              "autorelease: snapshot",
              "autorelease: published",
            ]);
            const base = context.payload.repository.default_branch;
            const repoFullName = context.payload.repository.full_name;
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              base,
              state: "open",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });
            let updated = 0;
            for (const pr of prs) {
              if (pr.draft) continue;
              if (pr.user?.type === "Bot") continue; // knope release PR + Renovate
              if (pr.head?.repo?.full_name !== repoFullName) continue; // fork PR
              if (pr.labels.some((l) => EXCLUDE.has(l.name))) continue;
              try {
                // repos.merge (App-enabled, unlike update-branch): merge the
                // default branch INTO the PR branch — same effect as clicking
                // "Update branch".
                const resp = await github.rest.repos.merge({
                  ...context.repo,
                  base: pr.head.ref, // target: the PR branch
                  head: base,        // source: the default branch
                });
                // 201 = merge commit created; 204 = already up to date (no-op).
                if (resp.status === 201) {
                  core.info(`updated #${pr.number} ${pr.title}`);
                  updated++;
                } else {
                  core.info(`#${pr.number} already current`);
                }
              } catch (err) {
                // 409 (merge conflict) and 404 (branch vanished) are expected
                // per-PR conditions — skip and continue.
                if (err.status === 409 || err.status === 404) {
                  core.warning(`#${pr.number} skipped: ${err.message}`);
                } else {
                  throw err;
                }
              }
            }
            core.info(`done — ${updated} PR(s) updated`);
