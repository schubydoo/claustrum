name: Mutation Testing

# Mutation testing answers "do the tests actually ASSERT on behavior, or just
# touch the code?" It mutates source (flip operators, change return values,
# negate conditionals) and re-runs the suite. A passing suite against a mutation
# = a "lived" mutant = a weak assertion somewhere.
#
# NOT a per-PR check — it runs the suite once per mutant, which put the last
# complete run (2026-08-03) at 25 minutes and later runs past 30. Budget in
# tens of minutes, not minutes. `-failfast` means a KILLED mutant stops at its
# first failing test, so suite-time × mutants is an upper bound, not the cost:
# on 08-03 that bound was ~77 min against 25 min actual. Runs on demand
# (workflow_dispatch) or weekly (schedule) as a periodic test-quality audit.
# Advisory: scheduled runs are report-only (threshold 0); an explicit dispatch
# can pin a quality bar.
#
# gremlins has a known Windows bug (path-separator mismatch between the cover
# profile and the AST scanner) that misclassifies every mutant as "not covered"
# — pinning to ubuntu-latest sidesteps it.

on:
  workflow_dispatch:
    inputs:
      fail-under-efficacy:
        description: "Fail the run if mutation efficacy is below this percent (0 = report only)"
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: gremlins
    runs-on: ubuntu-latest
    # 30 minutes stopped being enough on 2026-08-10. The 08-03 run finished in
    # 26 min; 08-10 and 08-17 then hit the limit at 30m16s each. (08-24 and
    # 08-31 failed inside a minute on the Go 1.27 break instead — see PR 303 —
    # which hid this until that was fixed.) A job timeout is reported as
    # "cancelled", not "failure", so these read as cancellations; the
    # discriminator is the annotation "The job has exceeded the maximum
    # execution time of 30m0s".
    #
    # Nothing regressed. Cost grows on both axes at once — more mutants from
    # more source, and a longer suite per mutant — and it did: 12 min (07-13),
    # 16, 17, 26 (08-03).
    #
    # 90 is margin over an estimate, not a measured bound. Extrapolating the
    # 08-03 run over the tree's growth put a 2-worker run at ~55-65 min;
    # --workers=4 (below) roughly halves that. Tighten this once a complete
    # run gives a real number.
    timeout-minutes: 90
    env:
      GREMLINS_VERSION: v0.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Follow the go.mod toolchain, like every other job that sets up Go.
          # This job used `stable` + check-latest to track future gremlins
          # requirements without editing go.mod, but go.mod satisfies v0.6.0's
          # >= 1.25 (caught up in PR 86), so `stable` bought nothing — and it
          # opted this job out of the deliberate hold below Go 1.27, whose
          # default jsonv2 emits a literal U+FFFD where v1 emits the ASCII
          # \ufffd escape. The invalid-UTF-8 guards in
          # inherited_encoding_test.go then fail and gremlins never reaches
          # its first mutant. See docs/UPSTREAM-TRACKING.md → toolchain drift.
          go-version-file: go.mod
          cache: true

      - name: Install gremlins
        # go install pulls the binary into $GOPATH/bin, which setup-go adds to
        # PATH. Pinning the version keeps reports comparable run-to-run (Renovate
        # bumps GREMLINS_VERSION via a custom manager in renovate.json).
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}

      - name: Verify gremlins on PATH
        # nproc is recorded so --workers can be justified against the runner
        # this job actually got, rather than against GitHub's published spec.
        # Core count is the whole question here: the suite is a single package
        # with no t.Parallel, so GOMAXPROCS does not affect it and is not worth
        # reporting (`go env GOMAXPROCS` is not a go env key — it exits 0 and
        # prints nothing, so asking for it would log a blank).
        run: |
          gremlins --version
          echo "runner cores: $(nproc)"

      - name: Run mutation testing
        # --integration runs the FULL suite per mutant (not gremlins' heuristic
        #   subset) — the socket integration tests drive the daemon end-to-end,
        #   so a mutant is only "killed" if the whole suite catches it.
        # --coverpkg=./... gathers coverage across the module so gremlins knows
        #   which mutants are worth running.
        # --workers=4 because the suite is wait-bound, not CPU-bound: measured
        #   locally on 4 pinned cores it draws 40% of ONE core, and 4 copies
        #   run concurrently finished in 20.9s against 24.3s for a single copy,
        #   all passing. So 4 workers cost ~1.6 cores of the 4 a public repo's
        #   runner provides. Do not raise this much further without re-measuring
        #   — the suite asserts on deadlines and idle-close timing, and a mutant
        #   whose test fails from starvation is scored KILLED (inflating
        #   efficacy) while one that hangs past gremlins' timeout is scored
        #   TIMED OUT and dropped from the efficacy denominator entirely.
        # --output emits machine-readable JSON for the summary + artifact.
        # --threshold-efficacy gates the exit code on the caller-supplied percent
        #   (0 = report-only). The dispatch input flows through env: (not inlined
        #   into the shell) to keep zizmor's template-injection audit happy.
        #
        # NOTE: the positional arg is a filesystem DIRECTORY, not a Go package
        # pattern. Passing `./...` makes gremlins walk a literal `./...` dir,
        # find nothing, and exit "No results to report." Omit it so gremlins
        # defaults to the module root.
        env:
          THRESHOLD_EFFICACY: ${{ inputs.fail-under-efficacy || '0' }}
        run: |
          set -euo pipefail
          gremlins unleash \
            --integration \
            --coverpkg=./... \
            --workers=4 \
            --output=gremlins.json \
            --threshold-efficacy="${THRESHOLD_EFFICACY}"

      - name: Summarize results
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f gremlins.json ]; then
            echo "::warning::no gremlins.json produced; skipping summary"
            exit 0
          fi
          {
            echo "## Mutation testing results"
            jq -r '
              "**Test efficacy:** \(.test_efficacy)%",
              "**Mutation coverage:** \(.mutations_coverage)%",
              "",
              "| Status | Count |",
              "|---|---|",
              "| Total (covered) | \(.mutants_total) |",
              "| KILLED | \(.mutants_killed) |",
              "| LIVED | \(.mutants_lived) |",
              "| NOT COVERED | \(.mutants_not_covered) |",
              "| NOT VIABLE | \(.mutants_not_viable) |"
            ' gremlins.json
            echo ""
            echo "### Lived mutants (likely weak assertions)"
            jq -r '.files[] | .file_name as $f | .mutations[]? | select(.status == "LIVED") | "- `\(.type)` at \($f):\(.line):\(.column)"' gremlins.json || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gremlins-report
          path: gremlins.json
          retention-days: 30
          if-no-files-found: warn
