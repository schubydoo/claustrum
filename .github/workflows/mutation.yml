name: Mutation Testing

# Mutation testing answers "do the tests actually ASSERT on behavior, or just
# touch the code?" It mutates source (flip operators, change return values,
# negate conditionals) and re-runs the suite. A passing suite against a mutation
# = a "lived" mutant = a weak assertion somewhere.
#
# NOT a per-PR check — runtime is ~suite-time × number-of-mutants, well into
# multi-minute territory. Runs on demand (workflow_dispatch) or weekly
# (schedule) as a periodic test-quality audit. Advisory: scheduled runs are
# report-only (threshold 0); an explicit dispatch can pin a quality bar.
#
# gremlins has a known Windows bug (path-separator mismatch between the cover
# profile and the AST scanner) that misclassifies every mutant as "not covered"
# — pinning to ubuntu-latest sidesteps it.

on:
  workflow_dispatch:
    inputs:
      fail-under-efficacy:
        description: "Fail the run if mutation efficacy is below this percent (0 = report only)"
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: gremlins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GREMLINS_VERSION: v0.6.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gremlins
        # go install pulls the binary into $GOPATH/bin, which setup-go adds to
        # PATH. Pinning the version keeps reports comparable run-to-run (Renovate
        # bumps GREMLINS_VERSION via a custom manager in renovate.json).
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}

      - name: Verify gremlins on PATH
        run: gremlins --version

      - name: Run mutation testing
        # --integration runs the FULL suite per mutant (not gremlins' heuristic
        #   subset) — the socket integration tests drive the daemon end-to-end,
        #   so a mutant is only "killed" if the whole suite catches it.
        # --coverpkg=./... gathers coverage across the module so gremlins knows
        #   which mutants are worth running.
        # --output emits machine-readable JSON for the summary + artifact.
        # --threshold-efficacy gates the exit code on the caller-supplied percent
        #   (0 = report-only). The dispatch input flows through env: (not inlined
        #   into the shell) to keep zizmor's template-injection audit happy.
        #
        # NOTE: the positional arg is a filesystem DIRECTORY, not a Go package
        # pattern. Passing `./...` makes gremlins walk a literal `./...` dir,
        # find nothing, and exit "No results to report." Omit it so gremlins
        # defaults to the module root.
        env:
          THRESHOLD_EFFICACY: ${{ inputs.fail-under-efficacy || '0' }}
        run: |
          set -euo pipefail
          gremlins unleash \
            --integration \
            --coverpkg=./... \
            --workers=2 \
            --output=gremlins.json \
            --threshold-efficacy="${THRESHOLD_EFFICACY}"

      - name: Summarize results
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f gremlins.json ]; then
            echo "::warning::no gremlins.json produced; skipping summary"
            exit 0
          fi
          {
            echo "## Mutation testing results"
            jq -r '
              "**Test efficacy:** \(.testEfficacy)%",
              "**Mutator coverage:** \(.mutationsCoverage)%",
              "",
              "| Status | Count |",
              "|---|---|",
              "| KILLED | \(.killed)  |",
              "| LIVED | \(.lived)  |",
              "| NOT COVERED | \(.notCovered)  |",
              "| TIMED OUT | \(.timedOut)  |",
              "| NOT VIABLE | \(.notViable)  |",
              "| SKIPPED | \(.skipped)  |"
            ' gremlins.json
            echo ""
            echo "### Lived mutants (likely weak assertions)"
            jq -r '.files[]?.mutants[]? | select(.status == "LIVED") | "- `\(.type)` at \(.fileName):\(.lineNumber):\(.columnNumber)"' gremlins.json || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gremlins-report
          path: gremlins.json
          retention-days: 30
          if-no-files-found: warn
