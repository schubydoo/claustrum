name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "includes/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "includes/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize Pages deploys; don't cancel an in-flight deploy.
  group: pages
  cancel-in-progress: false

jobs:
  # Strict build runs on every PR and push — a broken doc link or bad nav fails
  # the check. The Pages artifact is only uploaded for a real deploy (push/main).
  build:
    name: build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: install toolchain
        # --require-hashes: docs/requirements.txt is a fully hash-pinned lock
        # (compiled from docs/requirements.in via uv pip compile --generate-hashes),
        # so a tampered/substituted package on PyPI fails the install. Satisfies
        # Scorecard Pinned-Dependencies.
        run: pip install --require-hashes -r docs/requirements.txt
      - name: build (strict)
        run: mkdocs build --strict --site-dir site
      - name: upload pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write # deploy to Pages
      id-token: write # OIDC token for the deploy action
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
