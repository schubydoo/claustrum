name: Security

# Consolidates the project's security scanners into one file so the security
# posture is grokkable at a glance. Each scanner is its own JOB (not a step) so
# they run in parallel and appear individually in the PR checks list and in the
# code-scanning Security tab. Adapted from schubydoo/balenamcp:
#  - codeql language is `go` (autobuild handles `go build` discovery; main.go
#    is at the module root)
#  - the changes gate watches go.mod / go.sum + workflow files
#  - trivy-fs scans go.sum for vulnerable Go deps

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each entry on a temporary gh-readonly-queue branch.
  # The required check of this file must report there too.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

# A merge-group run gets a group of its own, and no other run cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && format('merge-group-{0}', github.run_id) || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      deps: ${{ steps.diff.outputs.deps }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      # A merge group diffs its base against its head, so the entries ahead of
      # it in the queue count too.
      - name: Diff against base
        id: diff
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = merge_group ]; then
            files=$(git diff --name-only "${GROUP_BASE_SHA}...${GROUP_HEAD_SHA}")
          else
            git fetch origin "${BASE_REF}" --depth=50
            files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          deps=false
          workflows=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              go.mod|go.sum) deps=true ;;
              .github/workflows/*.yml|.github/workflows/*.yaml) workflows=true ;;
            esac
          done <<< "$files"
          {
            echo "deps=$deps"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved flags: deps=$deps workflows=$workflows"

  codeql:
    name: codeql analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: secret scan
    # gitleaks-action exits 1 on an event outside push, pull_request,
    # workflow_dispatch and schedule. The PR run scanned the same changes.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is a JS action pinned to node20; opt into the node24
          # migration early so a hard cutover doesn't blindside us. No-op on
          # runners that haven't shipped node24 yet.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  trivy-fs:
    name: trivy filesystem scan
    needs: changes
    # Skip on PRs and merge groups that don't touch go.mod/go.sum. Always run on
    # push/schedule.
    if: needs.changes.outputs.deps == 'true' || (github.event_name != 'pull_request' && github.event_name != 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  zizmor:
    name: workflow audit
    needs: changes
    # Skip on PRs and merge groups that don't touch workflows. Always run on
    # push/schedule.
    if: needs.changes.outputs.workflows == 'true' || (github.event_name != 'pull_request' && github.event_name != 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        # zizmor is a Python tool; uv is the fastest cross-platform installer.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # This repo is Go-only, so uv's dependency-file hashing never matches;
          # disable the cache to silence the "cache will never get invalidated"
          # notice. We install one tool once per run and discard it.
          enable-cache: false
      - name: Install zizmor
        run: uv tool install zizmor==1.32.0
      - name: Run zizmor
        run: zizmor --format sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
          category: zizmor

  dependency-review:
    name: dependency review
    # Only meaningful on PRs (compares HEAD vs base for new vulnerable deps).
    # A merge group skips it: the PR run reviewed the same dependency change.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  security-required-checks-passed:
    name: security required checks passed
    if: always()
    needs:
      - changes
      - codeql
      - gitleaks
      - trivy-fs
      - zizmor
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed (or were intentionally skipped)."
