name: Release

# Build, SBOM, sign, and publish release artifacts on a v* tag, then attach a
# SLSA provenance attestation. Satisfies OpenSSF Scorecard:
#   - SBOM            — CycloneDX SBOM (syft) published as a release asset
#   - Signed-Releases — cosign .sigstore.json signatures (8/10) + a
#                       *.intoto.jsonl SLSA provenance file (10/10)
#
# Fired by the `v*` tag that knope-release.yml pushes when a `chore: prepare
# release` PR merges (knope opens those PRs from `.changeset/` fragments). Can also
# be driven by hand: `git tag v0.1.0 && git push origin v0.1.0`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Releases must NOT cancel each other — a half-uploaded release is worse than
  # letting two runs serialize.
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: goreleaser (build + SBOM + sign + upload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release + upload assets
      id-token: write # Sigstore keyless + provenance: exchange OIDC at Fulcio
      attestations: write # actions/attest-build-provenance records SLSA provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # goreleaser walks the git log for the version, prior tag, and
          # changelog window — depth 1 leaves it blind.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds are infrequent and from-scratch; a poisoned cache
          # could influence what we sign and upload (zizmor cache-poisoning).
          cache: false

      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install cosign (keyless signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run goreleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance over the release artifacts, via GitHub's native
      # attestation action — SHA-pinnable — instead of the slsa-github-generator
      # reusable workflow. The generator references an internal action by tag
      # (detect-workflow-js@v2.1.0), which this repo's "require SHA-pinned actions"
      # policy rejects and which a caller cannot override. subject-checksums reads
      # goreleaser's checksums.txt and attests every listed artifact by digest.
      - name: Locate checksums file
        id: sums
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          f=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
          [ -s "$f" ] || { echo "no checksums file in goreleaser artifacts" >&2; exit 1; }
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: ${{ steps.sums.outputs.file }}

      # Attach the provenance bundle as a *.intoto.jsonl release asset. Scorecard's
      # Signed-Releases probe matches on the .intoto.jsonl SUFFIX (prefix is free),
      # taking the score from 8/10 to 10/10. Runs on a tag push OR a
      # workflow_dispatch re-publish of an existing tag (goreleaser is mode:append).
      - name: Attach provenance to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE" ] || { echo "no provenance bundle produced; refusing to publish without provenance" >&2; exit 1; }
          cp "$BUNDLE" claustrum.intoto.jsonl
          gh release upload "$TAG" claustrum.intoto.jsonl --clobber
