# Minimal CI: format, vet, cross-build all 6 targets, test.
# (Action refs use version tags for readability; pin to commit SHAs if you adopt
#  OpenSSF Scorecard.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: cross-build all targets
        run: |
          set -e
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "build $t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags="-s -w" -o /tmp/claustrum-${t%/*}-${t#*/} .
          done
