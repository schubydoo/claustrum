name: CI

# Format, vet, module hygiene, race tests (ubuntu + macos + windows — the
# suites use the test binary itself as the process fixture, helperproc_test.go,
# and AF_UNIX is supported on Windows ≥ 1803, so the Windows-only Job Object
# code in sysproc_windows.go actually executes in CI — IMPROVEMENTS #20),
# cross-build of all 6 release targets, and a coverage floor. A single
# aggregator job (`ci required checks passed`) is what branch protection gates
# on — extend it by adding jobs to its `needs`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (gofmt + vet + tidy + golangci)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum drifted; run 'go mod tidy' locally and commit"
            exit 1
          fi

      - name: golangci-lint
        # Pinned to the golangci-lint version validated locally; bump it and the
        # .golangci.yml together. (The action SHA is what Renovate tracks.)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      # Blocking, unlike the advisory changeset-check.yml (which only asks whether
      # a fragment exists). This gates the SHAPE of the fragments that do exist: a
      # multi-line body makes knope render a `#### heading` block instead of a
      # bullet, which is what broke the 1.7.2 and 1.7.3 release notes.
      - name: changeset fragments are one-liners
        run: python3 scripts/lint_changesets.py

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # the windows leg is markedly slower than ubuntu/macos
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Renovate bumps this via a customManagers entry in the shared
      # schubydoo/renovate-config:claustrum preset — the same shape as
      # GREMLINS_VERSION in mutation.yml. A bare `@v1.13.0` inline would be
      # invisible to every manager: gomod reads go.mod/go.sum (untouched by a
      # `go install` outside the module) and github-actions reads `uses:`.
      GOTESTSUM_VERSION: v1.13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # gotestsum wraps `go test -json` to emit JUnit XML, which is the only format
      # Codecov's Test Analytics ingests — Go has no native JUnit writer. It is a CI
      # TOOL, not a module dependency: `go install <pkg>@<version>` outside the module
      # leaves go.mod and go.sum untouched (verified), so the repo's "no new
      # dependencies" rule is not in play.
      #
      # Version comes from GOTESTSUM_VERSION above so Renovate can see it; pinning
      # matches the repo's hash-pin policy for actions at the granularity Go
      # modules offer, and the tracker is what makes the pin stay honest.
      #
      # GOPATH/bin is added to PATH explicitly. mutation.yml relies on setup-go
      # doing it, which is true — but only that job is Linux-only. This one runs
      # on windows too, where the implicit path is the thing most likely to differ,
      # so $GITHUB_PATH under `shell: bash` is the portable form. Both comments are
      # right for their own job; this note exists so the difference does not read
      # as one of them being wrong.
      - name: Install gotestsum
        shell: bash
        run: |
          go install gotest.tools/gotestsum@"${GOTESTSUM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Same flags as before — `-race -count=1 ./...` — just run through gotestsum so
      # a junit.xml falls out. gotestsum exits NON-ZERO when a test fails (verified:
      # exit 1, with failures="1" in the XML), so this still gates the job exactly as
      # `go test` did.
      #
      # `standard-verbose` (plain `go test -v`), NOT the `pkgname` default.
      #
      # To be accurate about what pkgname does and does not do, because the obvious
      # justification for this change is wrong: pkgname DOES print a failing test's
      # own output in its end-of-run summary (checked directly — a subtest's
      # `x_test.go:7: …` line appears under `=== Failed`). It is not hiding
      # diagnostics.
      #
      # What it does not do is STREAM. pkgname emits one line per package, and this
      # repo is a single package, so nothing at all appears until the run finishes —
      # and the summary only prints if the run finishes. That is the gap worth
      # closing: a test that hangs until a runner or step deadline kills the job
      # leaves a log with no indication of which test was running. Verbose shows the
      # last `=== RUN` either way. A windows-latest leg on 2026-08-02 spent 30s in
      # one test's exec deadline, and "which test, and how far did it get" had to be
      # inferred from elapsed time rather than read.
      #
      # It also makes per-test timing visible on every leg, which is the input to
      # judging whether a slow windows test is drifting toward its deadline.
      #
      # Alternative if this proves too noisy: `github-actions` (testname format plus
      # collapsible ::group:: markers) — quieter, still not streaming. `--junitfile`
      # is independent of `--format`, so Codecov's ingest is unaffected either way.
      - name: go test
        run: gotestsum --format standard-verbose --junitfile junit.xml -- -race -count=1 ./...
      # Upload from EVERY leg, tagged with its OS as a Codecov flag, so Test Analytics
      # (flaky/slow tests) breaks out per platform — which is the axis claustrum
      # actually varies on. The matrix has no second dimension, so one cell per OS is
      # already what this produces; no cell-selection filter is needed.
      #
      # No token: claustrum is a public repo, so codecov-action uploads tokenless (same
      # rationale as the coverage upload below). Non-blocking — Codecov is never a
      # required check and upload flakiness must not fail CI. `!cancelled()` so a
      # FAILED test run still uploads: gotestsum writes junit.xml before exiting
      # non-zero, and a failing suite is exactly when the analytics matter. Skips
      # knope's release-bot PRs, where code never moves.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'claustrum-ci[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: junit.xml
          # `files` is ADDITIVE, not exclusive — the action's own docs say the
          # listed files "will be added to the coverage files found for upload".
          # Without this the CLI still walks the checkout looking for more. There
          # is nothing else JUnit-shaped to find today, so this buys exactness and
          # a skipped filesystem walk on three legs, not a bug fix.
          disable_search: true
          flags: ${{ runner.os }}
          report_type: test_results
          fail_ci_if_error: false
      # Keep the junit files even when the upload is a no-op. The Codecov step is
      # deliberately non-blocking, so a rejected upload is a warning line and
      # nothing else; the coverage job already retains coverage.out for exactly
      # this reason. Named per-OS because artifact names must be unique across a
      # matrix.
      - name: Upload test results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: junit.xml
          retention-days: 7

  cross-build:
    name: cross-build (6 targets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build all targets (CGO off, trimpath, stripped)
        run: |
          set -e
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "build $t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} \
              go build -trimpath -ldflags="-s -w" -o "/tmp/claustrum-${t%/*}-${t#*/}" .
          done

  coverage:
    # Single Ubuntu run with cross-package attribution (-coverpkg=./...) so
    # socket-driven hits count against every package. Floor is a notch below the
    # current number so new commits don't immediately fail; raise it as the suite
    # grows. (50% → 65% after the install/bridge/version/signal unit tests took
    # total coverage to ~70%; → 75% after the methods/process/extract-tar/
    # shellenv unit tests took it to ~77%; → 95% after the error-path sweep plus
    # the osExit-seam lifecycle tests took it to ~98% — what remains is
    # unreachable in-process (os.Executable/build-info/crypto-rand failures) or
    # Windows-only arms this Ubuntu job can't see.)
    name: coverage (>= 95%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COVERAGE_MIN: "95.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -coverpkg=./... \
            ./...

      - name: Enforce minimum coverage
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t < m) }'; then
            echo "::error::coverage ${total}% is below the ${COVERAGE_MIN}% floor"
            echo "::group::Uncovered functions"
            go tool cover -func=coverage.out | grep -v '100.0%' | grep -v '^total:'
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 7

      # Report coverage to Codecov for visibility (PR comment + trend graphs +
      # per-component breakdown, configured in codecov.yml). The REAL gate is the
      # COVERAGE_MIN floor enforced above — Codecov is informational, never a
      # required check, and upload flakiness must never fail CI (fail_ci_if_error:
      # false). Codecov ingests Go's native `coverage.out` directly. `!cancelled()`
      # so a FAILED `go test` (which fails the floor step) still uploads, surfacing
      # a coverage drop precisely when it matters. Skips knope's release bot PRs
      # (code never moves; the comment is pure noise) — filtered on the PR author
      # (same bot-skip rationale as pr-auto-update.yml); the login is empty on push, so
      # main-branch uploads are unaffected. No token: claustrum is a public repo,
      # so codecov-action uploads tokenless as long as the Codecov org keeps
      # public-repo token-auth off (the default; "Global Upload Token" setting) — a
      # CODECOV_TOKEN secret is only needed if that's re-enabled. fail_ci_if_error
      # above keeps a token/upload hiccup non-fatal either way.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'claustrum-ci[bot]' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false

  ci-required-checks:
    # Single check for branch protection to gate on. Aggregates every job whose
    # failure should block merging. Add new required jobs by extending `needs`.
    name: ci required checks passed
    if: always()
    needs: [lint, test, cross-build, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed."
