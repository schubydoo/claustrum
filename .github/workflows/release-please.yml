# Release Please reads Conventional Commits on main and opens a "release PR"
# that bumps the version in .release-please-manifest.json and rewrites
# CHANGELOG.md. Merging that PR tags the commit (e.g. `v0.2.0`), which fires
# release.yml (`on: push: tags`).
#
# This workflow runs release-please as TWO separate invocations on purpose: one
# that ONLY cuts the release (creates tag + GitHub Release), and — after the
# tag exists — one that ONLY opens/updates the next release PR. Splitting the
# two halves stops release-please from opening a bogus full-history downgrade
# PR while the release is still tag-less (see the per-step notes below).
name: Release Please

on:
  push:
    branches: [main]
  # Manual re-run for the rare case a publish fails midway and is finished by
  # hand: re-running opens/updates the next release PR against the now-existing
  # tag. The "open next PR" step is idempotent and gated on success().
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN stays read-only; the App token (minted below) does all
    # release writing (PR, version bump, GitHub Release, tag).
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Mint a short-lived installation token for the release GitHub App so
      # the release PR and version-bump commits are authored by the App's bot
      # identity, NOT a human account. Crucially this is *not* the default
      # GITHUB_TOKEN, so the tag pushed when the release PR merges still
      # *triggers* release.yml (GITHUB_TOKEN-pushed tags don't — anti-recursion).
      #
      # Requires (set up once, manually):
      #   - A GitHub App owned by the repo owner, installed on this repo, with
      #     repo permissions Contents: R/W + Pull requests: R/W.
      #   - Secrets RELEASE_PLEASE_APP_ID (numeric App ID) and
      #     RELEASE_PLEASE_APP_PRIVATE_KEY (the App's .pem private key).
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # --- Cut the release (creates tag + GitHub Release if release PR merged) ---
      # The first half of release-please: if this push is the merge commit of
      # a release PR, create the git tag and a (non-draft) GitHub Release with
      # the CHANGELOG body. skip-github-pull-request prevents it from also
      # opening the NEXT release PR in this same step — that is deferred to the
      # invocation below. Deferring (2) until after the tag exists means
      # release-please sees the real latest version when computing the next
      # bump, and never opens a bogus full-history downgrade PR (observed in
      # the wild when a draft release carries no tag yet).
      - name: Cut the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # --- goreleaser note ---
      # When release_created is true the tag now exists on origin. The
      # release.yml workflow fires automatically on that tag push and runs
      # goreleaser, which appends the 6 platform binaries + SBOM + cosign
      # signatures to the GitHub Release just created above (mode: append in
      # .goreleaser.yaml). No explicit step is needed here.

      # --- Open or update the next release PR (tag now exists) ---
      # The second half of release-please: open/update the PR that proposes
      # the NEXT release. skip-github-release means it never touches the
      # GitHub Release — it only manages the release-please-- PR. By now the
      # tag (if this was a release push) exists on origin, so release-please
      # sees the real latest version: 0 unreleased commits → opens nothing;
      # new commits → a correct PR based on the true latest tag.
      # Default `if: success()`, so a failed "cut" step leaves the current
      # release for hand-recovery instead of opening a PR against stale state.
      - name: Open the next release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
