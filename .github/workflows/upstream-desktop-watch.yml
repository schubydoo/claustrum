# Scheduled watcher for new reference `claude-ssh` builds.
#
# WHAT — automates Step 1 of docs/UPSTREAM-TRACKING.md ("find a candidate SHA").
# Claude Desktop bakes the pinned reference daemon SHA + per-platform manifest into
# its app bundle, so a new Desktop build is itself the "new SHA" signal. This job:
#   1. reads the APT `Packages` index → newest Claude Desktop for Linux,
#   2. downloads that `.deb` and reads the pinned SHA out of `app.asar`
#      (scripts/latest-desktop-sha.py → scripts/extract-desktop-pin.py),
#   3. compares it to the baseline in scripts/UPSTREAM_SHA, and
#   4. when it differs, runs the existing static drift check and opens a tracking
#      issue. Reconciliation stays a human decision (per the doc's Step 4).
#
# SAFETY / SCOPE
#   * Read-only except `issues: write` (it opens ONE idempotent tracking issue).
#   * persist-credentials:false — the token is only used by `gh`, never git.
#   * The heavy path (download .deb, build claustrum, diff) runs ONLY when a new
#     SHA is found, so the normal weekly run is cheap.
#   * Advisory: the job stays green even on a new build — the issue is the signal.
name: upstream-desktop-watch

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-desktop-watch
  cancel-in-progress: false

jobs:
  watch:
    name: watch for new claude-ssh reference build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Downloads the latest Desktop .deb and reads the pinned SHA from app.asar.
      # Stdlib-only Python; emits desktop_version / claude_ssh_sha / is_new / ... .
      - name: Discover latest Desktop pin
        id: discover
        run: python3 scripts/latest-desktop-sha.py --github-output

      - name: Job summary
        run: |
          {
            echo "## Upstream desktop watch"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| latest Desktop (Linux) | \`${{ steps.discover.outputs.desktop_version }}\` |"
            echo "| pinned claude-ssh SHA | \`${{ steps.discover.outputs.claude_ssh_sha }}\` |"
            echo "| baseline (scripts/UPSTREAM_SHA) | \`${{ steps.discover.outputs.baseline_sha }}\` |"
            echo "| new reference build? | **${{ steps.discover.outputs.is_new }}** |"
            echo "| claude-code CLI | \`${{ steps.discover.outputs.claude_code_cli }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- everything below runs ONLY when the pin moved off the baseline ----

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.discover.outputs.is_new == 'true'
        with:
          go-version-file: go.mod

      - name: Static drift check (advisory)
        id: drift
        if: steps.discover.outputs.is_new == 'true'
        continue-on-error: true
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zstd || true
          fi
          scripts/check-upstream.sh "${{ steps.discover.outputs.claude_ssh_sha }}" | tee drift.txt

      - name: Open tracking issue (idempotent)
        if: steps.discover.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.discover.outputs.claude_ssh_sha }}
          DESKTOP: ${{ steps.discover.outputs.desktop_version }}
          BASELINE: ${{ steps.discover.outputs.baseline_sha }}
          MAN: ${{ steps.discover.outputs.manifest_url }}
        run: |
          set -euo pipefail
          short="${SHA:0:12}"
          title="Upstream: new claude-ssh reference build ${short}"

          # Idempotent: if an open issue with this exact title already exists, do
          # nothing (avoids a weekly comment until the baseline is bumped).
          existing="$(gh issue list --repo "$REPO" --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [ -n "$existing" ]; then
            echo "issue #$existing already tracks $short — nothing to do"
            exit 0
          fi

          drift_out="$(cat drift.txt 2>/dev/null || echo '(drift check did not run)')"
          body="$(cat <<EOF
          A newer **Claude Desktop for Linux** (\`$DESKTOP\`) pins a \`claude-ssh\`
          reference build that differs from the baseline in \`scripts/UPSTREAM_SHA\`.

          | | |
          |---|---|
          | Latest Desktop (Linux) | \`$DESKTOP\` |
          | New reference SHA | \`$SHA\` |
          | Current baseline | \`$BASELINE\` |
          | Manifest | $MAN |

          Discovered automatically by \`.github/workflows/upstream-desktop-watch.yml\`
          (\`scripts/latest-desktop-sha.py\` reads the pin from the Desktop
          \`.deb\`'s \`app.asar\` — see docs/UPSTREAM-TRACKING.md Step 1).

          ### Static drift check
          \`\`\`
          $drift_out
          \`\`\`

          ### Next steps (docs/UPSTREAM-TRACKING.md Step 4)
          1. Reconcile any wire drift the check flagged.
          2. Run the private byte-for-byte battery in \`scratch/\` for frame parity.
          3. Bump \`scripts/UPSTREAM_SHA\` to \`$SHA\`, add a row to
             \`docs/REFERENCE-BUILDS.md\`, and note it in \`CHANGELOG.md\`.

          _This issue is opened once per new SHA; the watcher goes quiet again once
          the baseline is bumped._
          EOF
          )"

          gh issue create --repo "$REPO" --title "$title" --body "$body" \
            --label upstream-tracking 2>/dev/null \
          || gh issue create --repo "$REPO" --title "$title" --body "$body"
