name: Claude review

on:
  # The review is requested by a comment, so this trigger is required. The hardening lives
  # in the called workflow: an exact-command allow list, a guard hook, and a pin to the head SHA.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  review:
    # A called workflow cannot hold more permissions than the caller grants.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: schubydoo/shared-workflows/.github/workflows/claude-review.yml@3fc0ad0721781f418a5745a22c9438f3d0806fbd # main
    with:
      model: claude-opus-5
      timeout-minutes: 60
      # The api path: `claude -p` on the plan's API credits, signed in with Workload Identity
      # Federation, posting as claustrum-ci. These four are identifiers, not credentials.
      # Set `auth: oauth` (or drop these five lines) to go back to claude-code-action.
      auth: api
      anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic-organization-id: ${{ vars.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    secrets:
      # The claustrum-ci App. create-github-app-token v3.3.0 takes the numeric App ID in
      # `client-id`: it passes either input to the same appId field.
      app-client-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
