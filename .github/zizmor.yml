# zizmor configuration. https://docs.zizmor.sh/configuration/
rules:
  unpinned-uses:
    config:
      # Blanket policy: every action must be hash-pinned by SHA. The one
      # exception is the SLSA generator's reusable workflow, which MUST be
      # referenced by a semver tag, not a SHA — it derives the trusted-builder
      # identity from its own ref, and SHA-pinning breaks provenance. The repo
      # glob (not a bare owner/repo) is required because the `uses:` carries a
      # subpath to the reusable workflow file.
      policies:
        "*": hash-pin
        "slsa-framework/slsa-github-generator/*": ref-pin
