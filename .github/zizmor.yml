# zizmor configuration. https://docs.zizmor.sh/configuration/
rules:
  unpinned-uses:
    config:
      # Blanket policy: every action must be hash-pinned by SHA. This matches the
      # repository's "require SHA-pinned actions" GitHub policy. Provenance uses
      # actions/attest-build-provenance (a normal, SHA-pinnable action) rather than
      # the slsa-github-generator reusable workflow, so no ref-pin exception is
      # needed.
      policies:
        "*": hash-pin
