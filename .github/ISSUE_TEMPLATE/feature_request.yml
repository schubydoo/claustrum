name: Feature request
description: Suggest an enhancement for claustrum
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for the idea! Note claustrum's one hard rule: it stays
        **byte-identical to the reference daemon's JSON-RPC frames**. Changes to
        the wire surface (methods, params, result field order, error codes, frame
        shape) need a deliberate, documented protocol decision — see
        [docs/PROTOCOL.md](https://github.com/schubydoo/claustrum/blob/main/docs/PROTOCOL.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's getting in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Sketches of flags, methods, or behavior welcome.
    validations:
      required: true
  - type: dropdown
    id: wire-impact
    attributes:
      label: Does this affect the JSON-RPC wire surface?
      options:
        - "No — additive / tooling / docs only"
        - "Yes — touches methods, params, results, or frames"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one.
