# golangci-lint v2 config. The standard linter set (errcheck, govet,
# ineffassign, staticcheck, unused) plus a couple of low-noise extras. Run
# locally with `golangci-lint run ./...`; CI gates on the same.
version: "2"

linters:
  default: standard
  enable:
    - misspell # typos in comments/strings
    - unconvert # redundant type conversions
  settings:
    errcheck:
      # Ignoring a Close() error — almost always on a defer — is idiomatic and
      # not worth wrapping every call site in a closure. Every other unchecked
      # error is made explicit at the call site with `_ =`.
      exclude-functions:
        - (io.Closer).Close
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # startPipeTransport's non-Windows stub (pipetransport_other.go) returns a
      # non-nil error unconditionally so server.go cross-compiles; the named-pipe
      # transport is Windows-only. On the Linux lint leg that makes enablePipe's
      # `err != nil` provably always true, which staticcheck v2.13.1+ flags as
      # SA4023. The branch is intentional and unreachable off Windows, so exclude
      # SA4023 for this file rather than distort the stub.
      - path: server.go
        linters:
          - staticcheck
        text: SA4023
