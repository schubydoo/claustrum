# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration. Schema: https://www.coderabbit.ai/integrations/schema.v2.json
#
# NOTE: this repo-level file OVERRIDES the CodeRabbit web dashboard — configure
# everything here, not in the dashboard (dashboard edits won't take effect).
#
# Doc comments: Go API docs are exercised by `go vet` + golangci-lint (the "lint"
# CI job, on: pull_request); CodeRabbit's separate docstring-coverage pre-merge
# check is Python-shaped and reports a misleading % against Go, so both CodeRabbit
# docstring features are turned off — defer to the CI linters as the single source
# of truth.
language: "en-US"
early_access: true

# The hard invariant here is byte-identical JSON-RPC frames (see CLAUDE.md /
# docs/PROTOCOL.md). Steer review toward what actually breaks the wire contract
# and what CI can't catch; skip what the linters already gate. Squeezed under
# CodeRabbit's 250-char tone_instructions cap.
tone_instructions: >-
  Assertive, high-signal. Prioritize: JSON frame/field-order drift, silent
  failures, concurrency/lifecycle bugs, unix/windows parity, release-workflow
  correctness, weak test assertions. Skip what CI gates (gofmt/vet/golangci)
  and typos.

reviews:
  profile: "assertive"
  # Nitpicks anchor as inline, resolvable threads on CHANGED diff lines; the
  # `main` ruleset's conversation-resolution requirement then forces resolving each
  # before merge. Out-of-diff notes fall back to the collapsed section (GitHub's
  # review API can't anchor those) — treat that section as advisory.
  request_changes_workflow: true
  high_level_summary: false
  high_level_summary_placeholder: ""
  high_level_summary_in_walkthrough: true
  review_status: true
  # Publish a pass/fail commit status (a visible gate signal; not a *required*
  # check unless added to the main branch ruleset).
  fail_commit_status: true
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  pre_merge_checks:
    # See the doc-comment note at the top — the CI linters are the source of truth.
    docstrings:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  auto_review:
    enabled: true
    drafts: false
    # Bot PRs (release-please, Renovate) are reviewed, NOT ignored — on purpose.
    # If `main` is gated on a required `CodeRabbit` status (fail_commit_status
    # above), an *ignored* bot PR posts no status and would be unmergeable. Review
    # is cheap (deps / CHANGELOG / version bumps) and keeps the gate uniform. (No
    # `ignore_usernames` for this reason.)
  # Public repo: flag spam / low-quality drive-by PRs.
  slop_detection:
    enabled: true
  # Don't spend review effort on generated / committed-blob content.
  path_filters:
    - "!dist/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
  path_instructions:
    - path: "results.go"
      instructions: >-
        Result structs declare fields in the EXACT order the reference daemon
        emits them on the wire — order is the contract, not a style choice. Never
        suggest alphabetizing fields, and flag any `map` type (maps reorder keys on
        marshal and break byte-identical frames).
    - path: "testdata/**"
      instructions: >-
        These are committed golden fixtures of the exact reference wire frames.
        Byte differences are the signal — do NOT suggest reformatting, pretty-
        printing, or "cleaning up" the JSON; a change here means a frame changed.
    - path: "*_windows.go"
      instructions: >-
        OS-specific half of a build-tagged pair (`*_unix.go` / `*_windows.go`).
        When reviewing one side, check the other keeps the JSON-RPC surface
        identical — divergence is only allowed in platform mechanics, never frames.

chat:
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  # Review against our documented conventions, not just generic best-practice:
  # the contributor guide, the project rules, and the wire-frame spec.
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "CLAUDE.md"
      - "docs/PROTOCOL.md"
