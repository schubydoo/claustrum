# Release automation for claustrum — knope (replaces release-please).
#
# Model: CHANGESETS-ONLY. Every user-facing change ships a `.changeset/*.md`
# fragment; those fragments — not commit messages — drive BOTH the version bump
# and the changelog. Conventional-commit PR titles are still enforced
# (pr-title.yml) for a clean history, but are IGNORED for release purposes, so a
# `feat:`/`fix:` PR with no fragment does not release. `knope document-change`
# scaffolds one; see CONTRIBUTING.md → "Changesets".
#
# knope only ORCHESTRATES (version PR + changelog + tag + GitHub Release). The
# signed build — 6 goreleaser binaries + SBOM + cosign + SLSA provenance — still
# runs in release.yml on the pushed `v*` tag (unchanged). knope's `release`
# workflow therefore creates a plain, non-draft release with NO `assets`;
# goreleaser appends the artifacts to it (`.goreleaser.yaml` release.mode: append),
# exactly the hand-off release-please used.

[package]
# claustrum's version is otherwise tag-driven (goreleaser injects `-X
# main.Version` from the tag; the binary reports embedded VCS info when unstamped
# — see main.go). Go has no version manifest, so this plain VERSION file is
# knope's sole source of truth for the current version; it is bumped in the
# release PR and is what knope tags. The build never reads it.
versioned_files = [
  { path = "VERSION", regex = '(?<version>\d+\.\d+\.\d+)' },
]
changelog = "CHANGELOG.md"

# Changelog sections beyond the built-in Features (minor) / Fixes (patch) /
# Breaking changes (major), preserved from the release-please config. A
# custom-typed changeset is always a `patch` bump (knope rule).
extra_changelog_sections = [
  { name = "Performance", types = ["perf"] },
  { name = "Build System & Dependencies", types = ["build"] },
  { name = "Reverts", types = ["revert"] },
]

[changes]
ignore_conventional_commits = true # fragments in .changeset/ are the sole source of truth

[github]
owner = "schubydoo"
repo = "claustrum"

# --- changelog entry rendering ----------------------------------------------
# Auto-append the PR number to each entry: knope traces the changeset file's
# commit to the PR that introduced it ($pr_number). Ordered most- to
# least-specific — knope uses the first template whose variables all resolve, so
# a headed changeset keeps its `### + body`, a one-line changeset renders as a
# bullet, and either drops `(#NNN)` when not yet traceable (e.g. a local dry-run).
[release_notes]
change_templates = [
  "### $summary ([#$pr_number](https://github.com/schubydoo/claustrum/pull/$pr_number))\n\n$details",
  "### $summary\n\n$details",
  "- $summary ([#$pr_number](https://github.com/schubydoo/claustrum/pull/$pr_number))",
  "- $summary",
]

# --- prepare-release: open/refresh the `release` PR (run on push to main) ------
# PrepareRelease consumes the .changeset fragments, bumps VERSION + CHANGELOG.md,
# and stages them. We then add the compare link under the new heading, commit, and
# open/refresh the release PR. A human merging that PR is the approval gate.
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"

# knope writes a plain `## X.Y.Z (date)` heading with no diff link (a linked
# heading is one knope stops recognizing as a release). claustrum's changelog uses
# release-please-style compare links, so we re-add one on its own line UNDER the
# heading, where knope preserves it. Idempotent; a no-op for the first release.
# The `git commit -am` below re-stages the edited CHANGELOG.md.
[[workflows.steps]]
type = "Command"
command = "python3 scripts/changelog_compare_link.py $version"

# Bake the version + a UTC timestamp into buildstamp.go. `go install pkg@vX.Y.Z`
# compiles the tagged source from the module cache: no vcs.* settings, no
# -ldflags, and debug.BuildInfo has no timestamp field — so the source itself is
# the only channel that reaches such a build, and without this it reports
# "built unknown". The file is tracked, so the `git commit -am` below stages it.
[[workflows.steps]]
type = "Command"
command = "python3 scripts/write_build_stamp.py $version"

[[workflows.steps]]
type = "Command"
command = 'git commit -am "chore: prepare release $version"'

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this PR tags and publishes **v$version** — the signed `release.yml` build (goreleaser: 6 binaries + SBOM + cosign + SLSA provenance) runs on the pushed tag.\n\nGenerated by knope from the `.changeset/` fragments — don't edit it by hand; add or amend a changeset on the source PR instead.\n\n---\n\n$changelog"

# --- release: tag + GitHub Release (run when the release PR merges) ------------
# A single bare Release step (no `assets`): knope creates a non-draft GitHub
# Release from the CHANGELOG notes and pushes the `v$version` tag as the
# claustrum-ci App, which triggers release.yml. goreleaser then appends the signed
# artifacts to this release. No-op if the version already has a release.
[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

# --- document-change: scaffold a new changeset fragment (local convenience) ---
# `knope document-change` walks you through creating a .changeset/*.md file.
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
