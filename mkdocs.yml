site_name: claustrum
site_description: >-
  A tiny, dependency-light Go daemon that hosts a remote Claude Code session
  over SSH: a CLI-version manager, a process supervisor, and a JSON-RPC
  multiplexer over an AF_UNIX socket.
site_url: https://schubydoo.github.io/claustrum/
site_author: Schuby

repo_url: https://github.com/schubydoo/claustrum
repo_name: schubydoo/claustrum
edit_uri: edit/main/docs/

# docs/ is the source tree; the built site lands in ./site (gitignored).
docs_dir: docs

# The build toolchain lives in docs/requirements.in and docs/requirements.txt
# for locality. Keep both out of the published site.
exclude_docs: |
  requirements.in
  requirements.txt

# Fail --strict on a broken internal anchor: mkdocs 1.6 reports these at info
# level, which --strict does not promote on its own.
validation:
  links:
    anchors: warn

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  # Render Material's :icon-shortcodes: (e.g. :material-sitemap:) as inline SVGs.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - pymdownx.inlinehilite
  # Mermaid diagrams: Material loads Mermaid from a CDN in the reader's browser.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/fold.js

nav:
  - Start:
      - Home: index.md
      - Tour of one session: TOUR.md
      - Glossary: GLOSSARY.md
  - Write a client:
      - How claustrum works: ARCHITECTURE.md
      - Protocol overview: PROTOCOL.md
      - Examples: EXAMPLES.md
      - Methods:
          - server.* (ping, capabilities, shutdown): protocol/server.md
          - Files:
              - files.validate (check a path): protocol/files-validate.md
              - files.stat (inspect a path): protocol/files-stat.md
              - files.list (list a folder): protocol/files-list.md
              - files.read (read a file): protocol/files-read.md
              - files.extract_tar (unpack a tar): protocol/files-extract-tar.md
          - Git:
              - git.info (repo info): protocol/git-info.md
              - git.status (changed files): protocol/git-status.md
              - git.list_branches (branches): protocol/git-list-branches.md
              - git.worktree_create (new worktree): protocol/git-worktree-create.md
              - git.worktree_remove (delete worktree): protocol/git-worktree-remove.md
          - launcher.resolve (managed launcher): protocol/launcher-resolve.md
          - Process:
              - process.spawn (start): protocol/process-spawn.md
              - process.stdin (send input): protocol/process-stdin.md
              - process.kill (signal): protocol/process-kill.md
              - process.killAndWait (stop and wait): protocol/process-killandwait.md
              - process.reattach (catch up): protocol/process-reattach.md
          - plugins.prune (clean up plugins): protocol/plugins-prune.md
  - Run the daemon:
      - Start, stop, log, token: DAEMON.md
      - Install the agent CLI: INSTALL.md
      - Security policy: https://github.com/schubydoo/claustrum/blob/main/SECURITY.md
  - Contribute:
      - Divergences: DIVERGENCES.md
      - Docs style guide: STYLE.md
      - Contributing guide: https://github.com/schubydoo/claustrum/blob/main/CONTRIBUTING.md
      - Changelog: https://github.com/schubydoo/claustrum/blob/main/CHANGELOG.md
      - Source (GitHub): https://github.com/schubydoo/claustrum
  - Parity record:
      - Upstream tracking: UPSTREAM-TRACKING.md
      - Reference builds: REFERENCE-BUILDS.md
      - Shipped ledger: IMPROVEMENTS.md
