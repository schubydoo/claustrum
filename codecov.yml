        - internal/files/fileslist_windows.go
        - internal/files/realpath.go
        - internal/files/realpath_unix.go
        - internal/files/realpath_windows.go
        - internal/pathcanon/netpath_windows.go
        - internal/files/filesreadreal_linux.go
        - internal/files/filesreadreal_other.go
        # files.extract_tar: the remove of a destDir entry that Windows cannot read.
        - internal/files/extractunreadable.go
        - internal/files/extractunreadable_unix.go
        - internal/files/extractunreadable_windows.go
    - component_id: process
      name: process supervisor
      paths:
        - process.go
        - sysproc_unix.go
        - sysproc_windows.go
        - compat_sysproc.go
        # The process group, the reap, the env and close helpers and the capped text.
        - internal/sysproc/sysproc.go
        - internal/sysproc/sysproc_unix.go
        - internal/sysproc/sysproc_windows.go
        - childjobs.go
        - childjobs_windows.go
        # 4534d86 exit-frame `signal` name: read from the wait status on unix, always
        # empty on Windows (parity).
        - internal/sysproc/process_signal_unix.go
        - internal/sysproc/process_signal_windows.go
        # 683cc6a9 temp-folder test of a spawn: an inherited temp-folder name whose
        # folder cannot take a file is not handed on (Linux and macOS).
        - tempfolder_unix.go
        - tempfolder_windows.go
        # 52d82f0a farewell of process.kill and process.killAndWait: the member rules,
        # the stdin write and the grace before the signal.
        - farewell.go
        # 683cc6a9 link-bound processes: the link, the unattended end and the spent ids.
        - linkbound.go
        # 4534d86 session supersede: the argv rule that keys a spawn to a CLI session, the
        # per-key spawn lock, and the eviction of the prior same-session process.
        - sessionsupersede.go
        # 19f30c46 exec-child trampoline: process.spawn re-execs the daemon to stamp a
        # spawned child's identity (CLAUDE_SSH_CHILD/CLAUDE_SSH_RUN_DIR) — a stable,
        # pid-reuse-safe marker in the child's environment. Run-dir derivation is
        # cross-platform (execchild.go); the trampoline is shared across unix
        # (execchild_unix.go) with an OS-specific start-time token (execchild_linux.go =
        # /proc ticks, execchild_darwin.go = ps start-time); windows uses the no-op.
        - execchild.go
        - execchild_unix.go
        - execchild_linux.go
        - execchild_darwin.go
        - execchild_other.go
        # 19f30c46 orphan registry: process.spawn writes <runDir>/children/<pid>.json so a
        # later daemon can reap a child left behind by a since-exited daemon. The record
        # struct + atomic write are cross-platform; the identity gather is OS-specific —
        # linux (boot_id/pidns, machine-id, /proc start-ticks) and darwin (boot-session
        # UUID, hostname, ps start-time) each have their own, and the remaining targets use
        # the no-op (childrecord_other.go); windows lands in the windows track. The handle on
        # the run dir, the record log lines and the removal at the end of a child are shared
        # by linux and darwin (childrecord_unix.go).
        - childrecord.go
        - childrecord_unix.go
        - childrecord_linux.go
        - childrecord_darwin.go
        - childrecord_other.go
        # 19f30c46 orphan reap: at -serve startup the daemon ends the process groups of
        # children a since-exited predecessor daemon of this run dir left orphaned, after
        # verifying each is still that recorded child. The decision logic is shared
        # (childreap.go, linux||darwin); the live-process read is OS-specific — /proc on
        # linux, ps on darwin — and windows uses the no-op (childreap_other.go). Every kill
        # and process read is seamed so tests never touch a real process.
        - childreap.go
        - childreap_linux.go
        - childreap_darwin.go
        - childreap_other.go
        # 19f30c46 host cleaner: a periodic -serve background sweep that ends
        # orphaned Claude Code process groups under this install's roots, retires abandoned
        # daemons and tidies their stale run dirs. The shared decision layer (hostclean.go, linux||darwin) drives
        # OS-specific reads: /proc on linux, sysctl kern.proc + KERN_PROCARGS2 + lsof on darwin
        # (hostclean_darwin.go). Windows uses the no-op (hostclean_other.go).
        # Every read, kill, dial, rename and remove is seamed so the
        # destructive paths are unit-tested without a real process or file (real behavior
        # validated on a throwaway VM).
        - hostclean.go
        - hostclean_linux.go
        - hostclean_darwin.go
        - hostclean_other.go
        # The process helpers of the child records, the reap, the host cleaner and the
        # run-dir lock: the group kill, the /proc mount, the node identity and the pidfd hold.
        - internal/procinfo/procinfo.go
        - internal/procinfo/procinfo_unix.go
        - internal/procinfo/procinfo_linux.go
        - internal/procinfo/procinfo_darwin.go
        - internal/procinfo/export_unix.go
        - internal/procinfo/export_linux.go
        - internal/procinfo/fortest_unix.go
        - internal/procinfo/fortest_linux.go
        - compat_procinfo.go
        - compat_procinfo_linux.go
    - component_id: bridge_cli
      name: bridge, CLI & config
      paths:
