        - internal/git/worktreestaging_modes_darwin.go
        - internal/git/worktreestaging_modes_linux.go
        - internal/git/worktreestaging_modes_unix.go
        - internal/git/worktreestaging_modes_windows.go
        # the retry of a held rename on Windows: the copy write and the staging move (5fd08069).
        - internal/renameretry/renameretry.go
        - internal/renameretry/renameretry_other.go
        - internal/renameretry/renameretry_windows.go
        # the held git directory of a create, and its steps through that folder (5fd08069).
        - internal/git/gitdiraccept.go
        - internal/git/gitdirheld.go
        # the `config.worktree` file: its settings on the git calls and the file of a new worktree (5fd08069).
        - internal/git/gitworktreeconfig.go
        - internal/git/gitworktreeconfig_unix.go
        - internal/git/gitworktreeconfig_windows.go
        # the gate and the answer of git.status (89cb6289).
        - internal/git/gitstatus.go
        # the git.info root per OS (89cb6289).
        - internal/git/gitinforoot_other.go
        - internal/git/gitinforoot_windows.go
        # the daemon's own GIT_* variables on the git calls of the git methods.
        - internal/git/gitenv.go
        # the cleaning of the daemon's environment for the git children (5fd08069, with claustrum's own rules).
        - internal/git/gitchildenv.go
        - internal/git/gitchildenv_darwin.go
        - internal/git/gitchildenv_other.go
        - internal/git/gitchildenv_unix.go
        - internal/git/gitchildenv_windows.go
        - internal/git/gitoutsidecalls.go
        # the git-directory trust check every git.* method runs first (f6010b97).
        - internal/git/gitdirtrust.go
        - internal/git/gitdirtrust_unix.go
        - internal/git/gitdirtrust_windows.go
        - internal/git/gitnorepo.go
        - internal/git/gitnorepo_unix.go
        - internal/git/gitnorepo_windows.go
