        # git.worktree_* machinery (containment, external roots, staleness, verify,
        # per-repo lock, leaf mkdir) + git hardening + the destructive-path guard.
        - internal/git/worktreecontain.go
        # Windows-only worktree-path spelling guard (trailing dot/space, colon).
        - internal/git/spelling_windows.go
        - internal/git/spelling_other.go
        - internal/git/worktreeexternal.go
        - internal/git/worktreeexternal_unix.go
        - internal/git/worktreeexternal_windows.go
