        - internal/git/hooksdevice_unix.go
        - internal/git/hooksdevice_windows.go
        # the time limits of the git calls (5fd08069).
        - internal/git/gitstop.go
        # the test that a git call still runs, at the bound of the second checkout listing.
        - internal/git/gitlive_darwin.go
        - internal/git/gitlive_linux.go
        - internal/git/gitlive_other.go
        # the index file of a new worktree and the registration step of the create rollback (89cb6289).
        - internal/git/githarden_index_unix.go
        - internal/git/githarden_index_windows.go
        # the configuration listing before each hardened call and its hook pins (89cb6289).
        - internal/git/gitlisting.go
        # the filter rule of the git.worktree_create checkout (5fd08069).
        - internal/git/gitfilter.go
        # the ssh door of the git.worktree_create checkout (be1c1ca5).
        - internal/git/gitsshdoor.go
        # the daemon's own read of the repository's config and its refusals (5fd08069).
        - internal/git/gitrepoconfig.go
        - internal/git/gitrepoconfig_unix.go
        - internal/git/gitrepoconfig_windows.go
        # the settings control: the state of git.info, the folder of one daemon and the start test (5fd08069).
        - internal/git/gitshadow.go
        - internal/git/gitshadowconfig.go
