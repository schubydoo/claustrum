# Codecov config. Coverage is REPORTED here for visibility (PR comment + trend
# graphs + per-component breakdown); the REAL gate is the CI coverage floor in
# .github/workflows/ci.yml (the `coverage (>= 95%)` job enforces COVERAGE_MIN on
# the single Ubuntu cell). The `project` status is `informational: true` (nudge,
# never block); `patch` is a real pass/fail traffic light on new-code coverage —
# but neither is a *required* check, so a red `patch` X still leaves the merge
# button green unless someone adds `codecov/patch` to branch protection. Coverage
# uploads from ONE Linux cell (the cross-package `-coverpkg=./...` run in ci.yml),
# so COVERAGE flags / carryforward / report-merging aren't needed.
#
# TEST RESULTS are separate and DO carry flags. The `test` job runs on all three
# OSes and uploads a gotestsum-produced junit.xml per leg with
# `report_type: test_results` and `flags: <Linux|macOS|Windows>`, so Test Analytics
# (flaky + slow tests) breaks out per platform — the axis claustrum actually varies
# on. Those flags tag test results, not coverage, so the single-cell coverage story
# above is unchanged and the comment layout below still has no coverage flags to
# show.
#
# Go note: Codecov ingests the native `go test -coverprofile` output
# (coverage.out) directly — no lcov/cobertura conversion step.
#
# Validate before deploying changes:
#   curl -X POST --data-binary @codecov.yml https://api.codecov.io/validate

codecov:
  # ci.yml uploads coverage even when the tests FAIL (the `!cancelled()` guard on
  # the upload step), on purpose: a coverage drop should surface exactly when a
  # change breaks something. So don't gate the Codecov status on CI passing, and
  # don't wait for CI before reporting — show coverage as soon as it's uploaded.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false
    # One upload cell (ubuntu), so report as soon as that single build lands —
    # don't wait for a phantom second uploader. Bump this if a 2nd cell ever
    # uploads coverage.
    after_n_builds: 1

coverage:
  precision: 2
  round: down # a strict floor rounds down, matching the CI COVERAGE_MIN gate
  range: "90...100" # red->green band tuned to a project that sits ~98%
  status:
    project:
      default:
        target: 95% # mirror the ci.yml COVERAGE_MIN floor
        threshold: 1% # tolerate sub-1% drift before flagging
        informational: true # nudge, never block — ci.yml is the source of truth
    patch:
      default:
        # New-code (diff) coverage gate. 80% flags under-tested new code without
        # going red on a PR whose one new branch is unreachable in-process (the same
        # class the 95% project floor already tolerates). Deliberately below the
        # project floor: a diff is a small sample, and one such branch is a large
        # share of it.
        target: 80%
        threshold: 0% # no slack — new code meets the target or the status goes red
        informational: false # a real pass/fail traffic light (still a non-required check)
        if_not_found: success # docs-only PRs upload no diff → don't block them

# Informational setup: the per-line PR annotations are mostly visual clutter; the
# comment + dashboard carry the signal.
github_checks:
  annotations: false

comment:
  # No COVERAGE flags are uploaded (single cell), so drop the empty "flags" panel
  # and show the per-component breakdown instead. The per-OS flags on the test
  # results upload do not appear here — Test Analytics renders separately.
  layout: "condensed_header, diff, components, files"
  behavior: default # update the existing comment in place
  require_changes: true # only comment when coverage actually moves
  hide_project_coverage: false

# Per-area coverage breakdown in the dashboard + PR comment. No `statuses` are
# defined, so components add VISIBILITY only — they do NOT create extra
# per-component PR status checks. claustrum is a single flat `package main` at the
# repo root, so paths are file globs; keep them roughly in sync as the wire
# surface moves (mirrors the Architecture section of CLAUDE.md).
component_management:
  individual_components:
    - component_id: rpc_dispatch
      name: rpc & dispatch
      paths:
        - rpc.go
        - results.go
    - component_id: server
      name: server & lifecycle
      paths:
        - server.go
        - tokenpersist.go
        - pipetransport.go
        - pipetransport_windows.go
        - pipetransport_other.go
        - detach_unix.go
        - detach_windows.go
        # 7d193f89 lifecycle additions: daemon-to-daemon socket handoff and the
        # 5-minute idle-connection close.
        - dahandoff.go
        # OS-split classifier for a refused handoff dial (ECONNREFUSED / WSAECONNREFUSED).
        - sockdead_other.go
        - sockdead_windows.go
        - idleconn.go
    - component_id: methods
      name: methods (server/files/git/process)
      paths:
        - methods_server.go
        # OS-split server.capabilities feature: external_root advertised on unix only.
        - capfeatures_other.go
        - capfeatures_windows.go
        - methods_files.go
        - methods_git.go
        - methods_process.go
        - worktreecopy.go
        # git.worktree_* machinery (containment, external roots, staleness, verify,
        # per-repo lock, leaf mkdir) + git hardening + the destructive-path guard.
        - worktreecontain.go
        - worktreeexternal.go
        - worktreeexternal_unix.go
        - worktreeexternal_windows.go
        # Windows gates the custom-worktree-location (worktreeRoot) capability off.
        - externalunsupported_windows.go
        - externalunsupported_other.go
        - worktreelock.go
        - worktreemkdir_unix.go
        - worktreemkdir_windows.go
        - worktreestale.go
        - worktreeverify.go
        - githarden.go
        - homeguard.go
        # cross-platform fs primitives for the git/files methods: path canon (git
        # frame spelling) and the O_DIRECTORY guard used by files.list.
        - pathcanon_unix.go
        - pathcanon_windows.go
        - odirectory_unix.go
        - odirectory_windows.go
    - component_id: process
      name: process supervisor
      paths:
        - process.go
        - sysproc_unix.go
        - sysproc_windows.go
    - component_id: bridge_cli
      name: bridge, CLI & config
      paths:
        - bridge.go
        - main.go
        - config.go
        # Declaration-only (two generated consts, no statements), so Codecov
        # never reports it and its absence could not show up as a coverage gap.
        # Listed anyway: main.go's -version reads it, and the rule is that every
        # production .go file appears here exactly once.
        - buildstamp.go
    - component_id: install
      name: install pipeline
      paths:
        - install.go
        - libc_linux.go
        - libc_other.go
    - component_id: env_compat
      name: shell-env & cross-platform
      paths:
        - expandpath.go
        - shellenv.go
        - shellenv_unix.go
        - shellenv_windows.go
    - component_id: observability
      name: logging, metrics & wire log
      paths:
        - logging.go
        - metrics.go
        - wirelog.go
